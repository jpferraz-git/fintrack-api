<section class="portfolio-card portfolio-holdings" aria-label="Portfolio holdings">
  <header class="portfolio-holdings__header">
    <h3>My Holdings</h3>

    <div class="portfolio-holdings__actions">
      <button type="button">Filter</button>
      <button type="button">Export</button>
    </div>
  </header>

  <div class="portfolio-holdings__table-wrap">
    <table class="portfolio-holdings__table">
      <thead>
        <tr>
          <th>Asset</th>
          <th>Amount</th>
          <th>Avg Buy Price</th>
          <th>Current Price</th>
          <th>Profit/Loss %</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <div class="portfolio-asset">
              <span class="portfolio-asset__icon portfolio-asset__icon--btc">B</span>
              <div>
                <p>Bitcoin</p>
                <span>BTC</span>
              </div>
            </div>
          </td>
          <td>12.4500000</td>
          <td>$42,150.00</td>
          <td class="portfolio-holdings__price">$64,812.24</td>
          <td><span class="portfolio-pill portfolio-pill--up">+53.76%</span></td>
          <td>
            <div class="portfolio-row-actions">
              <button type="button">Buy</button>
              <button type="button">Sell</button>
            </div>
          </td>
        </tr>

        <tr>
          <td>
            <div class="portfolio-asset">
              <span class="portfolio-asset__icon portfolio-asset__icon--eth">E</span>
              <div>
                <p>Ethereum</p>
                <span>ETH</span>
              </div>
            </div>
          </td>
          <td>142.203100</td>
          <td>$2,210.15</td>
          <td class="portfolio-holdings__price">$3,421.12</td>
          <td><span class="portfolio-pill portfolio-pill--up">+54.79%</span></td>
          <td>
            <div class="portfolio-row-actions">
              <button type="button">Buy</button>
              <button type="button">Sell</button>
            </div>
          </td>
        </tr>

        <tr>
          <td>
            <div class="portfolio-asset">
              <span class="portfolio-asset__icon portfolio-asset__icon--sol">S</span>
              <div>
                <p>Solana</p>
                <span>SOL</span>
              </div>
            </div>
          </td>
          <td>1,240.00000</td>
          <td>$154.20</td>
          <td class="portfolio-holdings__price">$142.10</td>
          <td><span class="portfolio-pill portfolio-pill--down">-7.84%</span></td>
          <td>
            <div class="portfolio-row-actions">
              <button type="button">Buy</button>
              <button type="button">Sell</button>
            </div>
          </td>
        </tr>

        <tr>
          <td>
            <div class="portfolio-asset">
              <span class="portfolio-asset__icon portfolio-asset__icon--dot">D</span>
              <div>
                <p>Polkadot</p>
                <span>DOT</span>
              </div>
            </div>
          </td>
          <td>5,000.00000</td>
          <td>$8.40</td>
          <td class="portfolio-holdings__price">$7.12</td>
          <td><span class="portfolio-pill portfolio-pill--down">-15.23%</span></td>
          <td>
            <div class="portfolio-row-actions">
              <button type="button">Buy</button>
              <button type="button">Sell</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
