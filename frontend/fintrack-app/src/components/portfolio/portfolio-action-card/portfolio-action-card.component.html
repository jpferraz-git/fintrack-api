<section class="portfolio-card portfolio-action" aria-label="Portfolio actions">
  <h3>Manage Assets</h3>
  <p>Open a new buy or sell transaction.</p>

  <div class="portfolio-action__buttons">
    <button type="button" class="portfolio-action__buy" (click)="openAddModal.emit()">Buy Asset</button>
    <button type="button" class="portfolio-action__sell" (click)="openSellModal.emit()">Sell Asset</button>
  </div>
</section>
