<div *ngIf="open" class="terminal-modal-backdrop" (click)="onBackdropClick($event)">
  <section class="terminal-modal terminal-modal--asset" role="dialog" aria-modal="true" aria-labelledby="add-asset-title">
    <header class="terminal-modal__header">
      <h2 id="add-asset-title">Add New Asset</h2>
      <button type="button" class="terminal-modal__close" aria-label="Close asset modal" (click)="close()">x</button>
    </header>

    <p class="terminal-modal__subtitle">Manual portfolio expansion</p>

    <form #assetForm="ngForm" class="terminal-modal__body" (ngSubmit)="addToPortfolio(assetForm)">
      <label class="terminal-modal__label" for="assetSymbol">Search Assets</label>
      <div class="terminal-modal__search-row">
        <input
          id="assetSymbol"
          class="terminal-modal__field"
          type="search"
          placeholder="Search (e.g. BTCUSDT, ETHUSDT, SOLUSDT)..."
          name="symbol"
          [(ngModel)]="symbolInput"
          required
        />
        <span>PAIR</span>
      </div>

      <div class="terminal-modal__split">
        <div>
          <label class="terminal-modal__label" for="assetQuantity">Amount Held</label>
          <input
            id="assetQuantity"
            class="terminal-modal__field"
            type="number"
            name="quantity"
            [(ngModel)]="quantity"
            min="0.00000001"
            step="0.00000001"
            required
          />
        </div>
        <div>
          <label class="terminal-modal__label" for="assetAvgPrice">Avg Buy Price (USD)</label>
          <input
            id="assetAvgPrice"
            class="terminal-modal__field"
            type="number"
            name="avgPrice"
            [(ngModel)]="avgPrice"
            min="0.00000001"
            step="0.01"
            required
          />
        </div>
      </div>

      <div class="terminal-modal__summary">
        <article>
          <span>Estimated Value</span>
          <strong>{{ formattedEstimatedValue }}</strong>
        </article>
        <article>
          <span>Asset Type</span>
          <strong class="text-green">CRYPTO</strong>
        </article>
      </div>

      <p class="terminal-modal__error" *ngIf="submitError">{{ submitError }}</p>

      <footer class="terminal-modal__footer terminal-modal__footer--stack">
        <button
          type="submit"
          class="terminal-button terminal-button--primary"
          [disabled]="assetForm.invalid || isSubmitting"
        >
          {{ isSubmitting ? 'Saving...' : 'Add to Portfolio' }}
        </button>
        <p>Data will be synced to your portfolio immediately after save.</p>
      </footer>
    </form>
  </section>
</div>
