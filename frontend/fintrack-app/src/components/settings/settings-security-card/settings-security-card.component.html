<article class="settings-card">
  <div>
    <h2 class="settings-card__title">Change your password</h2>
    <p class="settings-card__description">Use a strong password with at least 8 characters.</p>
  </div>

  <form class="settings-form" (ngSubmit)="updatePassword()">
    <div class="settings-form__grid">
      <label class="settings-field" for="settings-new-password">
        <span class="settings-field__label">New Password</span>
        <div class="settings-field__input-wrap">
          <input
            id="settings-new-password"
            class="settings-field__input"
            [type]="showNewPassword ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="Min. 8 chars, Aa1@"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="settings-field__toggle"
            (click)="toggleNewPasswordVisibility()"
          >
            {{ showNewPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <span class="settings-password-hint">
          Must contain uppercase, lowercase, number and special character.
        </span>
      </label>
    </div>

    <div class="settings-form__grid">
      <label class="settings-field" for="settings-confirm-password">
        <span class="settings-field__label">Confirm Password</span>
        <div class="settings-field__input-wrap">
          <input
            id="settings-confirm-password"
            class="settings-field__input"
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Repeat new password"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="settings-field__toggle"
            (click)="toggleConfirmPasswordVisibility()"
          >
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>
    </div>

    <div class="settings-actions">
      <button class="settings-btn settings-btn--primary" type="submit" [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Updating...' : 'Update password' }}
      </button>

      @if (passwordError) {
        <p class="settings-feedback settings-feedback--error">{{ passwordError }}</p>
      }

      @if (passwordUpdated) {
        <p class="settings-feedback">Password updated successfully.</p>
      }
    </div>
  </form>
</article>
