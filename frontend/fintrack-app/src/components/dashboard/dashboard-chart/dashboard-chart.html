<section class="dash-chart" aria-label="Market chart">
  <header class="dash-chart__header">
    <div class="dash-chart__title-row">
      <h2 class="dash-chart__title">BTC / USDT</h2>
      <span class="dash-chart__live">REAL-TIME</span>
    </div>
    <div class="dash-chart__intervals">
      <button type="button" class="dash-chart__interval dash-chart__interval--active">15m</button>
      <button type="button" class="dash-chart__interval">1h</button>
      <button type="button" class="dash-chart__interval">4h</button>
      <button type="button" class="dash-chart__interval">1D</button>
    </div>
  </header>

  <div class="dash-chart__canvas" role="img" aria-label="Candlestick chart preview">
    <div
      *ngFor="let candle of candles; trackBy: trackByIndex"
      class="dash-candle"
      [class.dash-candle--up]="candle.trend === 'up'"
      [class.dash-candle--down]="candle.trend === 'down'"
      [style.--wick-top]="candle.wickTop"
      [style.--wick-bottom]="candle.wickBottom"
      [style.--body-top]="candle.bodyTop"
      [style.--body-height]="candle.bodyHeight"
    ></div>
  </div>
</section>
