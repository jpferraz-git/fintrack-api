<section class="dash-market-cards" aria-label="Market summary">
  <article class="dash-market-card">
    <header class="dash-market-card__top">
      <div class="dash-market-card__instrument">
        <span class="dash-coin-icon dash-coin-icon--btc" aria-hidden="true">BTC</span>
        <p class="dash-market-card__pair">BTC / USDT</p>
      </div>

      <div class="dash-market-card__trend" aria-label="BTC trend">
        <span
          class="dash-market-card__delta"
          [class.dash-market-card__delta--up]="btcTrendUp"
          [class.dash-market-card__delta--down]="!btcTrendUp"
        >
          {{ loadingBtc ? 'Loading...' : btcDelta }}
        </span>
        <svg
          class="dash-market-card__sparkline"
          [class.dash-market-card__sparkline--up]="btcTrendUp"
          [class.dash-market-card__sparkline--down]="!btcTrendUp"
          viewBox="0 0 80 24"
          aria-hidden="true"
        >
          <polyline [attr.points]="btcTrendUp ? '2,18 14,16 24,17 34,13 44,11 56,12 66,8 78,4' : '2,7 14,9 24,8 34,12 44,11 56,14 66,16 78,19'"></polyline>
        </svg>
      </div>
    </header>

    <p class="dash-market-card__price">{{ btcPrice }}</p>
    <p class="dash-market-card__meta">{{ loadingBtc ? 'Vol: Loading...' : btcVolume }}</p>
  </article>

  <article class="dash-market-card">
    <header class="dash-market-card__top">
      <div class="dash-market-card__instrument">
        <span class="dash-coin-icon dash-coin-icon--eth" aria-hidden="true">ETH</span>
        <p class="dash-market-card__pair">ETH / USDT</p>
      </div>

      <div class="dash-market-card__trend" aria-label="ETH trend">
        <span class="dash-market-card__delta dash-market-card__delta--down">-0.12%</span>
        <svg class="dash-market-card__sparkline dash-market-card__sparkline--down" viewBox="0 0 80 24" aria-hidden="true">
          <polyline points="2,7 14,9 24,8 34,12 44,11 56,14 66,16 78,19"></polyline>
        </svg>
      </div>
    </header>

    <p class="dash-market-card__price">$3,492.15</p>
    <p class="dash-market-card__meta">Vol: 62M USDT</p>
  </article>

  <article class="dash-market-card">
    <header class="dash-market-card__top">
      <div class="dash-market-card__instrument">
        <span class="dash-coin-icon dash-coin-icon--bnb" aria-hidden="true">BNB</span>
        <p class="dash-market-card__pair">BNB / USDT</p>
      </div>

      <div class="dash-market-card__trend" aria-label="BNB trend">
        <span class="dash-market-card__delta dash-market-card__delta--up">+1.82%</span>
        <svg class="dash-market-card__sparkline dash-market-card__sparkline--up" viewBox="0 0 80 24" aria-hidden="true">
          <polyline points="2,20 14,17 24,15 34,16 44,12 56,10 66,8 78,6"></polyline>
        </svg>
      </div>
    </header>

    <p class="dash-market-card__price">$582.30</p>
    <p class="dash-market-card__meta">Vol: 132M USDT</p>
  </article>
</section>
