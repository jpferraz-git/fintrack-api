<section class="dash-table" aria-label="Market overview">
  <header class="dash-table__header">
    <h3>Market Overview</h3>
    <div class="dash-table__actions">
      <a href="#">Filter</a>
      <a href="#">Export</a>
    </div>
  </header>

  <table>
    <thead>
      <tr>
        <th>Coin</th>
        <th>Price</th>
        <th>24h Change</th>
        <th>24h Volume</th>
        <th>Market Cap</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr
        app-market-table-row
        *ngFor="let row of rows; trackBy: trackBySymbol"
        [symbol]="row.symbol"
        [coinName]="row.coinName"
        [marketCap]="row.marketCap"
      ></tr>
    </tbody>
  </table>
</section>
