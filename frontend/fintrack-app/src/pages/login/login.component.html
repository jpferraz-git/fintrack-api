<app-auth-layout>
  <section class="brand" aria-label="Brand" layout-brand>
    <h1 class="brand__logo">FINTRACK</h1>
    <p class="brand__tagline">Manage your crypto finances</p>
  </section>

  <app-auth-card
    layout-card
    title="Login"
    subtitle=""
  >
    <form class="auth-form" novalidate card-body (ngSubmit)="login()">
      <app-form-input
        label="Email Address"
        id="login-email"
        type="email"
        name="email"
        [(value)]="email"
        placeholder="name@institution.com"
        autocomplete="email"
        [required]="true"
      >
        <svg form-icon width="15" height="12" viewBox="0 0 15 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.5 12C1.0875 12 0.734375 11.8531 0.440625 11.5594C0.146875 11.2656 0 10.9125 0 10.5V1.5C0 1.0875 0.146875 0.734375 0.440625 0.440625C0.734375 0.146875 1.0875 0 1.5 0H13.5C13.9125 0 14.2656 0.146875 14.5594 0.440625C14.8531 0.734375 15 1.0875 15 1.5V10.5C15 10.9125 14.8531 11.2656 14.5594 11.5594C14.2656 11.8531 13.9125 12 13.5 12H1.5ZM7.5 6.75L1.5 3V10.5H13.5V3L7.5 6.75ZM7.5 5.25L13.5 1.5H1.5L7.5 5.25Z" fill="#86948A"/>
        </svg>
      </app-form-input>

      <app-form-input
        label="Password"
        id="login-password"
        type="password"
        name="password"
        [(value)]="password"
        placeholder="********"
        autocomplete="current-password"
        [required]="true"
      >
        <svg form-icon width="12" height="16" viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.5 15.75C1.0875 15.75 0.734375 15.6031 0.440625 15.3094C0.146875 15.0156 0 14.6625 0 14.25V6.75C0 6.3375 0.146875 5.98438 0.440625 5.69063C0.734375 5.39688 1.0875 5.25 1.5 5.25H2.25V3.75C2.25 2.7125 2.61562 1.82812 3.34687 1.09687C4.07812 0.365625 4.9625 0 6 0C7.0375 0 7.92188 0.365625 8.65312 1.09687C9.38437 1.82812 9.75 2.7125 9.75 3.75V5.25H10.5C10.9125 5.25 11.2656 5.39688 11.5594 5.69063C11.8531 5.98438 12 6.3375 12 6.75V14.25C12 14.6625 11.8531 15.0156 11.5594 15.3094C11.2656 15.6031 10.9125 15.75 10.5 15.75H1.5ZM1.5 14.25H10.5V6.75H1.5V14.25ZM6 12C6.4125 12 6.76562 11.8531 7.05937 11.5594C7.35312 11.2656 7.5 10.9125 7.5 10.5C7.5 10.0875 7.35312 9.73438 7.05937 9.44063C6.76562 9.14688 6.4125 9 6 9C5.5875 9 5.23438 9.14688 4.94063 9.44063C4.64688 9.73438 4.5 10.0875 4.5 10.5C4.5 10.9125 4.64688 11.2656 4.94063 11.5594C5.23438 11.8531 5.5875 12 6 12ZM3.75 5.25H8.25V3.75C8.25 3.125 8.03125 2.59375 7.59375 2.15625C7.15625 1.71875 6.625 1.5 6 1.5C5.375 1.5 4.84375 1.71875 4.40625 2.15625C3.96875 2.59375 3.75 3.125 3.75 3.75V5.25Z" fill="#86948A"/>
        </svg>
      </app-form-input>

      <div class="form-field__label-row">
        <!-- <div class="form-field form-field--checkbox">
          <input class="form-field__checkbox" type="checkbox" id="remember" name="remember" />
          <label class="form-field__checkbox-label" for="remember">Remember this device</label>
        </div> -->
        <a class="form-field__forgot" routerLink="/forgot-password">Forgot my password</a>
      </div>

      <app-cta-button type="submit">Login</app-cta-button>
    </form>

    <footer class="auth-card__footer" card-footer>
      <p class="auth-card__footer-text">Need an account?</p>
      <a class="auth-card__footer-link" routerLink="/signup">Create one</a>
    </footer>
  </app-auth-card>

</app-auth-layout>
