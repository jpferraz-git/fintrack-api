<div class="portfolio-screen">
  <app-sidebar></app-sidebar>

  <main class="portfolio-main">
    <app-portfolio-topbar></app-portfolio-topbar>

    <section class="portfolio-overview-grid">
      <app-portfolio-value-card></app-portfolio-value-card>

      <div class="portfolio-overview-grid__right">
        <app-portfolio-action-card (openModal)="openAddAssetModal()"></app-portfolio-action-card>
        <app-portfolio-risk-card></app-portfolio-risk-card>
      </div>
    </section>

    <app-portfolio-holdings-table></app-portfolio-holdings-table>
    <app-portfolio-statusbar></app-portfolio-statusbar>
  </main>

  <app-add-asset-modal
    [open]="isAddAssetModalOpen"
    (closed)="closeAddAssetModal()"
  ></app-add-asset-modal>
</div>
