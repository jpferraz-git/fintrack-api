<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KINETIC — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, Roboto, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(141.42% 141.42% at 0% 0%, rgba(16, 185, 129, 0.05) 0%, rgba(16, 185, 129, 0.00) 50%),
        radial-gradient(141.42% 141.42% at 100% 100%, #060E20 0%, rgba(6, 14, 32, 0.00) 50%),
        #0B1326;
      overflow: hidden;
      position: relative;
    }

    /* Decorative blur elements */
    .decor-top-left,
    .decor-bottom-right {
      position: fixed;
      width: 512px;
      height: 428px;
      border-radius: 12px;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .decor-top-left {
      top: -107px;
      left: -64px;
      background: rgba(78, 222, 163, 0.05);
    }

    .decor-bottom-right {
      bottom: -107px;
      right: -64px;
      background: rgba(164, 2, 23, 0.05);
    }

    /* Page wrapper */
    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 448px;
      padding: 40px 16px;
    }

    /* Brand identity */
    .brand-identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .brand-logo {
      font-family: Manrope, -apple-system, Roboto, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 800;
      line-height: 36px;
      letter-spacing: -1.5px;
      color: #4EDEA3;
      padding-bottom: 8px;
    }

    .brand-tagline {
      font-family: Inter, -apple-system, Roboto, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #BBCABF;
    }

    /* Card */
    .signup-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 32px;
      border-radius: 8px;
      border: 1px solid rgba(60, 74, 66, 0.20);
      background: rgba(23, 31, 51, 0.60);
      backdrop-filter: blur(8px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* Card header */
    .card-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-family: Manrope, -apple-system, Roboto, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
      color: #DAE2FD;
    }

    .card-subtitle {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: #BBCABF;
    }

    /* Form */
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      color: #BBCABF;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-icon {
      position: absolute;
      left: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .form-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border-radius: 8px;
      background: #2D3449;
      border: none;
      outline: none;
      font-family: Inter, -apple-system, Roboto, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #DAE2FD;
      transition: background 0.2s;
    }

    .form-input::placeholder {
      color: #86948A;
    }

    .form-input:focus {
      background: #353d56;
    }

    /* Password grid */
    .password-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Terms checkbox */
    .terms-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .terms-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      min-width: 16px;
      border-radius: 2px;
      border: 1px solid #3C4A42;
      background: #2D3449;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .terms-checkbox:checked {
      background: #4EDEA3;
      border-color: #4EDEA3;
    }

    .terms-label {
      font-size: 12px;
      font-weight: 400;
      color: #BBCABF;
      line-height: 1.4;
    }

    .terms-link {
      color: #4EDEA3;
      text-decoration: none;
    }

    .terms-link:hover {
      text-decoration: underline;
    }

    /* CTA button */
    .cta-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #4EDEA3 0%, #10B981 100%);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.10), 0 4px 6px -4px rgba(0, 0, 0, 0.10);
      font-family: Manrope, -apple-system, Roboto, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
      color: #003824;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .cta-button:hover {
      opacity: 0.92;
    }

    .cta-button:active {
      transform: scale(0.99);
    }

    /* Card footer */
    .card-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .footer-text {
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: #BBCABF;
      text-align: center;
    }

    .footer-login-link {
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      color: #4EDEA3;
      text-decoration: none;
    }

    .footer-login-link:hover {
      text-decoration: underline;
    }

    /* Technical metadata */
    .technical-metadata {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      opacity: 0.4;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-label {
      font-size: 10px;
      font-weight: 400;
      line-height: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #DAE2FD;
    }

    /* Responsive — mobile */
    @media (max-width: 480px) {
      .signup-card {
        padding: 24px 20px;
      }

      .password-grid {
        grid-template-columns: 1fr;
      }

      .brand-logo {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Decorative blur elements -->
  <div class="decor-top-left" aria-hidden="true"></div>
  <div class="decor-bottom-right" aria-hidden="true"></div>

  <main class="page-wrapper">

    <!-- Brand identity -->
    <div class="brand-identity">
      <h1 class="brand-logo">KINETIC</h1>
      <p class="brand-tagline">Institutional Terminal</p>
    </div>

    <!-- Signup card -->
    <div class="signup-card">

      <!-- Header -->
      <div class="card-header">
        <h2 class="card-title">Create Account</h2>
        <p class="card-subtitle">Join the obsidian ledger for elite asset monitoring.</p>
      </div>

      <!-- Form -->
      <form class="signup-form" novalidate>

        <!-- Full Name -->
        <div class="form-field">
          <label class="field-label" for="full-name">Full Name</label>
          <div class="input-wrapper">
            <span class="field-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 6C5.175 6 4.46875 5.70625 3.88125 5.11875C3.29375 4.53125 3 3.825 3 3C3 2.175 3.29375 1.46875 3.88125 0.88125C4.46875 0.29375 5.175 0 6 0C6.825 0 7.53125 0.29375 8.11875 0.88125C8.70625 1.46875 9 2.175 9 3C9 3.825 8.70625 4.53125 8.11875 5.11875C7.53125 5.70625 6.825 6 6 6ZM0 12V9.9C0 9.475 0.109375 9.08437 0.328125 8.72812C0.546875 8.37187 0.8375 8.1 1.2 7.9125C1.975 7.525 2.7625 7.23438 3.5625 7.04063C4.3625 6.84688 5.175 6.75 6 6.75C6.825 6.75 7.6375 6.84688 8.4375 7.04063C9.2375 7.23438 10.025 7.525 10.8 7.9125C11.1625 8.1 11.4531 8.37187 11.6719 8.72812C11.8906 9.08437 12 9.475 12 9.9V12H0ZM1.5 10.5H10.5V9.9C10.5 9.7625 10.4656 9.6375 10.3969 9.525C10.3281 9.4125 10.2375 9.325 10.125 9.2625C9.45 8.925 8.76875 8.67188 8.08125 8.50313C7.39375 8.33438 6.7 8.25 6 8.25C5.3 8.25 4.60625 8.33438 3.91875 8.50313C3.23125 8.67188 2.55 8.925 1.875 9.2625C1.7625 9.325 1.67188 9.4125 1.60312 9.525C1.53437 9.6375 1.5 9.7625 1.5 9.9V10.5ZM6 4.5C6.4125 4.5 6.76562 4.35312 7.05937 4.05937C7.35312 3.76562 7.5 3.4125 7.5 3C7.5 2.5875 7.35312 2.23438 7.05937 1.94062C6.76562 1.64687 6.4125 1.5 6 1.5C5.5875 1.5 5.23438 1.64687 4.94063 1.94062C4.64688 2.23438 4.5 2.5875 4.5 3C4.5 3.4125 4.64688 3.76562 4.94063 4.05937C5.23438 4.35312 5.5875 4.5 6 4.5Z" fill="#86948A"/>
              </svg>
            </span>
            <input
              class="form-input"
              id="full-name"
              type="text"
              name="fullName"
              placeholder="John Doe"
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-field">
          <label class="field-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="field-icon">
              <svg width="15" height="12" viewBox="0 0 15 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 12C1.0875 12 0.734375 11.8531 0.440625 11.5594C0.146875 11.2656 0 10.9125 0 10.5V1.5C0 1.0875 0.146875 0.734375 0.440625 0.440625C0.734375 0.146875 1.0875 0 1.5 0H13.5C13.9125 0 14.2656 0.146875 14.5594 0.440625C14.8531 0.734375 15 1.0875 15 1.5V10.5C15 10.9125 14.8531 11.2656 14.5594 11.5594C14.2656 11.8531 13.9125 12 13.5 12H1.5ZM7.5 6.75L1.5 3V10.5H13.5V3L7.5 6.75ZM7.5 5.25L13.5 1.5H1.5L7.5 5.25ZM1.5 3V1.5V3V10.5V3Z" fill="#86948A"/>
              </svg>
            </span>
            <input
              class="form-input"
              id="email"
              type="email"
              name="email"
              placeholder="name@institution.com"
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password grid -->
        <div class="password-grid">

          <!-- Password -->
          <div class="form-field">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrapper">
              <span class="field-icon">
                <svg width="12" height="16" viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1.5 15.75C1.0875 15.75 0.734375 15.6031 0.440625 15.3094C0.146875 15.0156 0 14.6625 0 14.25V6.75C0 6.3375 0.146875 5.98438 0.440625 5.69063C0.734375 5.39688 1.0875 5.25 1.5 5.25H2.25V3.75C2.25 2.7125 2.61562 1.82812 3.34687 1.09687C4.07812 0.365625 4.9625 0 6 0C7.0375 0 7.92188 0.365625 8.65312 1.09687C9.38437 1.82812 9.75 2.7125 9.75 3.75V5.25H10.5C10.9125 5.25 11.2656 5.39688 11.5594 5.69063C11.8531 5.98438 12 6.3375 12 6.75V14.25C12 14.6625 11.8531 15.0156 11.5594 15.3094C11.2656 15.6031 10.9125 15.75 10.5 15.75H1.5ZM1.5 14.25H10.5V6.75H1.5V14.25ZM6 12C6.4125 12 6.76562 11.8531 7.05937 11.5594C7.35312 11.2656 7.5 10.9125 7.5 10.5C7.5 10.0875 7.35312 9.73438 7.05937 9.44063C6.76562 9.14688 6.4125 9 6 9C5.5875 9 5.23438 9.14688 4.94063 9.44063C4.64688 9.73438 4.5 10.0875 4.5 10.5C4.5 10.9125 4.64688 11.2656 4.94063 11.5594C5.23438 11.8531 5.5875 12 6 12ZM3.75 5.25H8.25V3.75C8.25 3.125 8.03125 2.59375 7.59375 2.15625C7.15625 1.71875 6.625 1.5 6 1.5C5.375 1.5 4.84375 1.71875 4.40625 2.15625C3.96875 2.59375 3.75 3.125 3.75 3.75V5.25ZM1.5 14.25V6.75V14.25Z" fill="#86948A"/>
                </svg>
              </span>
              <input
                class="form-input"
                id="password"
                type="password"
                name="password"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-field">
            <label class="field-label" for="confirm-password">Confirm</label>
            <div class="input-wrapper">
              <span class="field-icon">
                <svg width="12" height="15" viewBox="0 0 12 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 15C4.2625 14.5625 2.82812 13.5656 1.69687 12.0094C0.565625 10.4531 0 8.725 0 6.825V2.25L6 0L12 2.25V6.825C12 8.725 11.4344 10.4531 10.3031 12.0094C9.17188 13.5656 7.7375 14.5625 6 15ZM6 13.425C7.3 13.0125 8.375 12.1875 9.225 10.95C10.075 9.7125 10.5 8.3375 10.5 6.825V3.28125L6 1.59375L1.5 3.28125V6.825C1.5 8.3375 1.925 9.7125 2.775 10.95C3.625 12.1875 4.7 13.0125 6 13.425Z" fill="#86948A"/>
                </svg>
              </span>
              <input
                class="form-input"
                id="confirm-password"
                type="password"
                name="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>
          </div>

        </div>

        <!-- Terms & Conditions -->
        <div class="terms-row">
          <input class="terms-checkbox" type="checkbox" id="terms" name="terms" />
          <label class="terms-label" for="terms">
            I agree to the <a class="terms-link" href="#">Terms of Service</a> and <a class="terms-link" href="#">Privacy Policy</a>.
          </label>
        </div>

        <!-- CTA Button -->
        <button class="cta-button" type="submit">
          Create Account
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10.1458 7.5H0V5.83333H10.1458L5.47917 1.16667L6.66667 0L13.3333 6.66667L6.66667 13.3333L5.47917 12.1667L10.1458 7.5Z" fill="#003824"/>
          </svg>
        </button>

      </form>

      <!-- Card footer -->
      <div class="card-footer">
        <p class="footer-text">Already have an account?</p>
        <a class="footer-login-link" href="#">Log in</a>
      </div>

    </div>

    <!-- Technical metadata -->
    <div class="technical-metadata" aria-label="Security information">
      <div class="meta-item">
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.79167 7.58333H5.54167L5.20625 5.70208C5.40069 5.60486 5.55382 5.46389 5.66563 5.27917C5.77743 5.09444 5.83333 4.89028 5.83333 4.66667C5.83333 4.34583 5.7191 4.07118 5.49062 3.84271C5.26215 3.61424 4.9875 3.5 4.66667 3.5C4.34583 3.5 4.07118 3.61424 3.84271 3.84271C3.61424 4.07118 3.5 4.34583 3.5 4.66667C3.5 4.89028 3.5559 5.09444 3.66771 5.27917C3.77951 5.46389 3.93264 5.60486 4.12708 5.70208L3.79167 7.58333ZM4.66667 11.6667C3.31528 11.3264 2.19965 10.551 1.31979 9.34062C0.439931 8.13021 0 6.78611 0 5.30833V1.75L4.66667 0L9.33333 1.75V5.30833C9.33333 6.78611 8.8934 8.13021 8.01354 9.34062C7.13368 10.551 6.01806 11.3264 4.66667 11.6667ZM4.66667 10.4417C5.67778 10.1208 6.51389 9.47917 7.175 8.51667C7.83611 7.55417 8.16667 6.48472 8.16667 5.30833V2.55208L4.66667 1.23958L1.16667 2.55208V5.30833C1.16667 6.48472 1.49722 7.55417 2.15833 8.51667C2.81944 9.47917 3.65556 10.1208 4.66667 10.4417Z" fill="#DAE2FD"/>
        </svg>
        <span class="meta-label">AES-256 Secured</span>
      </div>
      <div class="meta-item">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5.83333 11.6667C5.02639 11.6667 4.26806 11.5135 3.55833 11.2073C2.84861 10.901 2.23125 10.4854 1.70625 9.96042C1.18125 9.43542 0.765625 8.81806 0.459375 8.10833C0.153125 7.39861 0 6.64028 0 5.83333C0 5.02639 0.153125 4.26806 0.459375 3.55833C0.765625 2.84861 1.18125 2.23125 1.70625 1.70625C2.23125 1.18125 2.84861 0.765625 3.55833 0.459375C4.26806 0.153125 5.02639 0 5.83333 0C6.64028 0 7.39861 0.153125 8.10833 0.459375C8.81806 0.765625 9.43542 1.18125 9.96042 1.70625C10.4854 2.23125 10.901 2.84861 11.2073 3.55833C11.5135 4.26806 11.6667 5.02639 11.6667 5.83333C11.6667 6.64028 11.5135 7.39861 11.2073 8.10833C10.901 8.81806 10.4854 9.43542 9.96042 9.96042C9.43542 10.4854 8.81806 10.901 8.10833 11.2073C7.39861 11.5135 6.64028 11.6667 5.83333 11.6667ZM5.25 10.4708V9.33333C4.92917 9.33333 4.65451 9.2191 4.42604 8.99063C4.19757 8.76215 4.08333 8.4875 4.08333 8.16667V7.58333L1.28333 4.78333C1.25417 4.95833 1.22743 5.13333 1.20312 5.30833C1.17882 5.48333 1.16667 5.65833 1.16667 5.83333C1.16667 7.00972 1.55313 8.04028 2.32604 8.925C3.09896 9.80972 4.07361 10.325 5.25 10.4708ZM9.275 8.98333C9.67361 8.54583 9.97743 8.05729 10.1865 7.51771C10.3955 6.97813 10.5 6.41667 10.5 5.83333C10.5 4.88056 10.2351 4.01042 9.70521 3.22292C9.17535 2.43542 8.46806 1.86667 7.58333 1.51667V1.75C7.58333 2.07083 7.4691 2.34549 7.24062 2.57396C7.01215 2.80243 6.7375 2.91667 6.41667 2.91667H5.25V4.08333C5.25 4.24861 5.1941 4.38715 5.08229 4.49896C4.97049 4.61076 4.83194 4.66667 4.66667 4.66667H3.5V5.83333H7C7.16528 5.83333 7.30382 5.88924 7.41563 6.00104C7.52743 6.11285 7.58333 6.25139 7.58333 6.41667V8.16667H8.16667C8.41945 8.16667 8.64792 8.24201 8.85208 8.39271C9.05625 8.5434 9.19722 8.74028 9.275 8.98333Z" fill="#DAE2FD"/>
        </svg>
        <span class="meta-label">Global Node Sync</span>
      </div>
    </div>

  </main>

</body>
</html>
